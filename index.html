<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#e9e9e1" />
  <title>Ultra Balloon</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #121210;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    #game {
      display: block;
      image-rendering: pixelated;
      touch-action: none;
    }
    #fs-btn {
      position: fixed;
      bottom: 8px;
      right: 8px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      color: #8a9a6a;
      font: 11px ui-monospace, monospace;
      padding: 4px 8px;
      cursor: pointer;
      z-index: 10;
      border-radius: 3px;
    }
    #fs-btn:hover { background: rgba(255,255,255,0.18); color: #cfe09a; }
    @media (pointer: coarse) { #fs-btn { display: none; } }
  </style>
  <script type="module" crossorigin src="/ultra-baloon/assets/index-X-ZEiCqJ.js"></script>
</head>
<body>
  <canvas id="game"></canvas>
  <button id="fs-btn">FULLSCREEN (F)</button>
  <script>
    function toggleFS() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function(){});
      } else {
        document.exitFullscreen().catch(function(){});
      }
    }
    var fsBtn = document.getElementById('fs-btn');
    if (fsBtn) fsBtn.addEventListener('click', toggleFS);
    document.addEventListener('keydown', function (e) {
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) {
        e.preventDefault();
        toggleFS();
      }
    });
  </script>
</body>
</html>
